services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        FORCE_SYNTHETIC_SAMPLES: ${FORCE_SYNTHETIC_SAMPLES:-0}
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/stats.db}
      STATS_DRIVER: ${STATS_DRIVER:-sqlite}
      TZ: ${TZ:-Europe/Amsterdam}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Europe/Amsterdam}
      STATS_RETENTION_DAYS: ${STATS_RETENTION_DAYS:-90}
      VOICE_CLONE_URL: ${VOICE_CLONE_URL:-http://host.docker.internal:8765}
      VOICE_CLONE_TOKEN: ${VOICE_CLONE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - stats-data:/app/data
      - stats-backups:/app/backups
    restart: unless-stopped

volumes:
  stats-data:
  stats-backups:
